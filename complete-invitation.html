<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finaliser l’invitation — Adept Pro Track Mate</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1f2937}.box{width:430px;max-width:92%;margin:10vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 6px 24px #0001}.field{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}.btn{border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.muted{color:#6b7280}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-top:12px}.success{color:#166534;background:#dcfce7;padding:10px;border-radius:8px;margin-top:12px}</style></head><body><main class="box"><h1>Bienvenue 👋</h1><p class="muted">Votre invitation Adept Pro Track Mate est presque terminée.</p><div id="info">Vérification de l’invitation…</div><div id="form" style="display:none"><label>Nouveau mot de passe</label><input id="password" class="field" type="password" minlength="12" autocomplete="new-password"><br><br><label>Confirmer le mot de passe</label><input id="confirm" class="field" type="password" minlength="12" autocomplete="new-password"><br><br><button class="btn" id="finish">Créer mon accès</button></div><div id="msg"></div></main><script>const SUPABASE_URL='https://otbwhaguvekgxhawdson.supabase.co';const SUPABASE_KEY='sb_publishable_y5sJVBrn3CEptGvmK29wEA_SW9pAm0S';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function init(){const {data,error}=await sb.auth.getSession();if(error||!data.session){document.getElementById('info').innerHTML='<div class="error">Le lien d’invitation est invalide ou a expiré. Ouvrez le lien reçu dans votre e-mail à nouveau.</div>';return}const u=data.session.user;const role=u.user_metadata?.invited_role||'Utilisateur';document.getElementById('info').innerHTML='<p>Compte : <strong>'+String(u.email||'')+'</strong></p><p>Rôle attribué : <strong>'+String(role)+'</strong></p>';document.getElementById('form').style.display='block'}document.getElementById('finish').onclick=async()=>{const p=document.getElementById('password').value,c=document.getElementById('confirm').value,m=document.getElementById('msg');if(p.length<12){m.innerHTML='<div class="error">Le mot de passe doit contenir au moins 12 caractères.</div>';return}if(p!==c){m.innerHTML='<div class="error">Les mots de passe ne correspondent pas.</div>';return}const {error}=await sb.auth.updateUser({password:p});if(error){m.innerHTML='<div class="error">'+error.message+'</div>';return}m.innerHTML='<div class="success">Accès créé avec succès. Vous pouvez maintenant vous connecter au site.</div>';setTimeout(()=>location.href='./',1800)};init()</script></body></html>
