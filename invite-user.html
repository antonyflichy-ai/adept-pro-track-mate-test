<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inviter un utilisateur — Adept Pro Track Mate TEST</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1f2937}.box{width:520px;max-width:92%;margin:8vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 6px 24px #0001}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box}.btn{border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.muted{color:#6b7280}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-top:12px}.success{color:#166534;background:#dcfce7;padding:10px;border-radius:8px;margin-top:12px}</style></head><body><main class="box"><h1>✉️ Inviter un utilisateur</h1><p class="muted">Environnement TEST — réservé au Formateur Master.</p><label>E-mail</label><input id="email" class="field" type="email" autocomplete="email"><br><br><label>Rôle</label><select id="role" class="field"><option value="Tuteur">Tuteur</option><option value="Responsable d’agence">Responsable d’agence</option><option value="RH">RH</option></select><br><br><div id="agencyWrap" style="display:none"><label>Agence</label><select id="agency" class="field"><option>Dol de Bretagne</option><option>Mont de Marsan</option><option>Tarascon</option><option>Fleury Mérogis</option><option>Noisy le Gd</option><option>St Pierre de Chandieu</option><option>Vitry-en-Artois</option></select><br><br></div><button class="btn" id="send">Envoyer l’invitation</button><div id="msg"></div></main><script>const SUPABASE_URL='https://otbwhaguvekgxhawdson.supabase.co';const SUPABASE_KEY='sb_publishable_y5sJVBrn3CEptGvmK29wEA_SW9pAm0S';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const role=document.getElementById('role');const wrap=document.getElementById('agencyWrap');role.onchange=()=>wrap.style.display=role.value==='Responsable d’agence'?'block':'none';document.getElementById('send').onclick=async()=>{const msg=document.getElementById('msg');msg.innerHTML='';const email=document.getElementById('email').value.trim();if(!email){msg.innerHTML='<div class="error">Renseignez une adresse e-mail.</div>';return}const {data:{session}}=await sb.auth.getSession();if(!session){msg.innerHTML='<div class="error">Vous devez être connecté au site TEST.</div>';return}const body={email,role:role.value,agency:role.value==='Responsable d’agence'?document.getElementById('agency').value:null};const {data,error}=await sb.functions.invoke('invite-user',{body});if(error){msg.innerHTML='<div class="error">'+String(error.message||error)+'</div>';return}msg.innerHTML='<div class="success">Invitation envoyée. Vérifiez la boîte e-mail du destinataire.</div>';document.getElementById('email').value=''};</script></body></html>
