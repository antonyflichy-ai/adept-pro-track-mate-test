<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adept Pro Track Mate — Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box,.card{background:#fff;border-radius:14px;box-shadow:0 4px 18px #0001}.box{width:430px;max-width:100%;padding:28px}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:white}.light{background:#f3f4f6}.danger{background:#dc2626;color:white}.secondary{background:#6b7280;color:white}.error{color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-top:12px}.success{color:#166534;background:#dcfce7;padding:10px;border-radius:8px;margin-top:12px}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:21px;font-weight:700;color:#2563eb}.container{max-width:1200px;margin:24px auto;padding:0 16px}.muted{color:#6b7280}.cards,.menu{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:24px 0}.menu{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card{padding:20px}.card h3{margin:0 0 10px}.number{font-size:30px;font-weight:700;color:#2563eb}.menu button{background:#fff;border:0;border-radius:12px;box-shadow:0 2px 8px #0001;padding:22px;text-align:left;font-size:16px;cursor:pointer}.menu span{display:block;font-size:28px;margin-bottom:10px}.role{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:700;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.modal-bg{position:fixed;inset:0;background:#0f172a59;z-index:10}.modal{position:fixed;z-index:11;top:4%;left:50%;transform:translateX(-50%);width:900px;max-width:96%;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.row{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.calendar{margin-top:14px;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-day,.cal-name{min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:7px}.cal-name{font-size:12px;font-weight:700;color:#6b7280}.cal-day{border:1px solid #e5e7eb;background:#fff;cursor:pointer}.cal-day.empty{border:0;background:transparent;cursor:default}.cal-day.booked{background:#fee2e2;color:#991b1b;border-color:#fca5a5;cursor:not-allowed;text-decoration:line-through}.cal-day.start,.cal-day.end{outline:2px solid #2563eb}.cal-info{font-size:13px;margin-top:10px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px}.dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #d1d5db;margin-right:4px}.dot.red{background:#fee2e2;border-color:#fca5a5}.dot.white{background:#fff}</style></head><body><div id="app"></div><script>
const SUPABASE_URL='https://ngdgmijmdvneqbdbqwmy.supabase.co';const SUPABASE_KEY='sb_publishable_21Kr6md9gv-r9YCwPPYLsg_pi6X_1sA';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const AGENCES=['Dol de Bretagne','Mont de Marsan','Tarascon','Fleury Mérogis','Noisy le Gd','St Pierre de Chandieu','Vitry-en-Artois'];const FONCTIONS=['Conducteur','Aide-livreur','Technicien de quai','Autre'];const ROLE_RULES={'Formateur Master':{entrants:true,tuteurs:true,planning:true},'RH':{entrants:true,tuteurs:true,planning:true},'Responsable d’agence':{entrants:true,tuteurs:true,planning:true}};let profilConnecte=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const lire=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};const sauver=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function fermer(id){document.getElementById(id)?.remove();document.getElementById(id+'Bg')?.remove()}function ouvrir(id,html){fermer(id);const bg=document.createElement('div');bg.id=id+'Bg';bg.className='modal-bg';bg.onclick=()=>fermer(id);document.body.appendChild(bg);const m=document.createElement('div');m.id=id;m.className='modal';m.innerHTML=html;document.body.appendChild(m);return m}function autorise(a){return!!(profilConnecte&&ROLE_RULES[profilConnecte.role]?.[a])}
async function chargerProfil(user){const {data,error}=await sb.from('profiles').select('id,role,agency').eq('id',user.id).maybeSingle();if(error){console.error(error);return null}return data}function afficherConnexion(msg=''){document.getElementById('app').innerHTML=`<div class="auth"><div class="box"><h1>Adept Pro Track Mate</h1><p class="muted">Connexion sécurisée — environnement de test</p><label>E-mail</label><input id="email" class="field" type="email"><br><br><label>Mot de passe</label><input id="password" class="field" type="password"><div class="actions"><button class="btn primary" id="login">Se connecter</button></div><div id="authmsg">${msg?`<div class="success">${esc(msg)}</div>`:''}</div></div></div>`;document.getElementById('login').onclick=connecter}async function connecter(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,box=document.getElementById('authmsg');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await afficherApplication(data.user)}async function afficherApplication(user){profilConnecte=await chargerProfil(user);if(!profilConnecte){await sb.auth.signOut();afficherConnexion('Profil utilisateur introuvable. Accès refusé.');return}const role=profilConnecte.role||'Utilisateur';document.getElementById('app').innerHTML=`<header><div class="logo">Adept Pro Track Mate <small style="font-size:12px;color:#6b7280">TEST</small></div><div>${esc(user.email)} <span class="role">${esc(role)}</span> <button class="btn light" id="logout">Déconnexion</button></div></header><main class="container"><h1>Tableau de bord</h1><p class="muted">Environnement de test — accès selon le rôle du profil.</p><section class="cards"><div class="card"><h3>Nouveaux entrants</h3><div class="number">${lire('nouveauxEntrants').length}</div></div><div class="card"><h3>Tuteurs</h3><div class="number">${lire('tuteurs').length}</div></div><div class="card"><h3>Plannings</h3><div class="number">${lire('affectationsTuteurs').length}</div></div></section><section class="menu">${autorise('entrants')?'<button id="btnEntrants"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button>':''}${autorise('tuteurs')?'<button id="btnTuteurs"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button>':''}${autorise('planning')?'<button id="btnPlanning"><span>📅</span><strong>Planning</strong><br>Organiser les accompagnements</button>':''}</section></main>`;document.getElementById('logout').onclick=()=>sb.auth.signOut();if(document.getElementById('btnEntrants'))document.getElementById('btnEntrants').onclick=afficherEntrants;if(document.getElementById('btnTuteurs'))document.getElementById('btnTuteurs').onclick=ouvrirTuteurs;if(document.getElementById('btnPlanning'))document.getElementById('btnPlanning').onclick=ouvrirPlanning}
function afficherEntrants(){const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs');let h='<h2>👤 Nouveaux entrants</h2>';if(!e.length)h+='<div class="row">Aucun entrant enregistré.</div>';e.forEach((x,i)=>{const q=a.find(v=>v.entrantId===x.id);h+=`<div class="row"><strong>${esc(x.nom)}</strong><p>📅 ${esc(x.date)}<br>💼 ${esc(x.fonction)}<br>🏢 ${esc(x.agence)}<br>🎓 Tuteur : <strong>${q?esc(q.tuteurNom):'Non affecté'}</strong>${q?`<br>📆 Tutorat : ${esc(q.dateDebut)} → ${esc(q.dateFin||q.dateDebut)}`:''}</p><div class="actions"><button class="btn primary" data-aff="${i}">${q?'🔄 Changer le tuteur':'🎓 Affecter un tuteur'}</button><button class="btn danger" data-del="${i}">🗑️ Supprimer</button></div></div>`});h+='<div class="actions"><button class="btn primary" id="add">➕ Ajouter</button><button class="btn secondary" id="close">Fermer</button></div>';ouvrir('entrants',h);document.getElementById('add').onclick=()=>{fermer('entrants');ajouterEntrant()};document.getElementById('close').onclick=()=>fermer('entrants');document.querySelectorAll('[data-aff]').forEach(b=>b.onclick=()=>affecterTuteur(e[+b.dataset.aff]));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const idx=+b.dataset.del,id=e[idx].id;const ee=lire('nouveauxEntrants');ee.splice(idx,1);sauver('nouveauxEntrants',ee);sauver('affectationsTuteurs',a.filter(v=>v.entrantId!==id));afficherEntrants()})}
function ajouterEntrant(){ouvrir('add','<h2>👤 Ajouter un nouvel entrant</h2><label>Nom et prénom</label><input id="n" class="field"><br><br><label>Date d’entrée</label><input id="d" class="field" type="date"><br><br><label>Fonction</label><select id="f" class="field">'+FONCTIONS.map(x=>'<option>'+x+'</option>').join('')+'</select><br><br><label>Agence</label><select id="a" class="field">'+AGENCES.map(x=>'<option>'+x+'</option>').join('')+'</select><div class="actions"><button class="btn primary" id="save">Ajouter</button><button class="btn secondary" id="cancel">Annuler</button></div>');document.getElementById('save').onclick=()=>{const n=document.getElementById('n').value.trim(),d=document.getElementById('d').value,f=document.getElementById('f').value,a=document.getElementById('a').value;if(!n||!d)return alert('Renseignez le nom et la date.');const e=lire('nouveauxEntrants');e.push({id:crypto.randomUUID(),nom:n,date:d,fonction:f,agence:a});sauver('nouveauxEntrants',e);fermer('add');afficherEntrants()};document.getElementById('cancel').onclick=()=>fermer('add')}
function ouvrirTuteurs(){let h='<h2>🎓 Gestion des tuteurs</h2><input id="tn" class="field" placeholder="Nom et prénom"><div class="actions"><button class="btn primary" id="ta">Ajouter</button></div><hr>';const t=lire('tuteurs');t.forEach((x,i)=>h+=`<div class="row">👤 ${esc(x.nom)} <button class="btn danger" data-t="${i}">🗑️</button></div>`);h+='<button class="btn secondary" id="tc">Fermer</button>';ouvrir('tuteurs',h);document.getElementById('ta').onclick=()=>{const n=document.getElementById('tn').value.trim();if(!n)return;const t=lire('tuteurs');t.push({id:crypto.randomUUID(),nom:n});sauver('tuteurs',t);ouvrirTuteurs()};document.getElementById('tc').onclick=()=>fermer('tuteurs');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=lire('tuteurs'),idx=+b.dataset.t,id=t[idx].id;t.splice(idx,1);sauver('tuteurs',t);sauver('affectationsTuteurs',lire('affectationsTuteurs').filter(v=>v.tuteurId!==id));ouvrirTuteurs()})}
function dateOnly(s){return new Date(s+'T00:00:00')}function chevauchement(debut,fin,autreDebut,autreFin){const d1=dateOnly(debut),d2=dateOnly(fin||debut),a1=dateOnly(autreDebut),a2=dateOnly(autreFin||autreDebut);return d1<=a2&&a1<=d2}function joursPris(tuteurId,excludeEntrantId=''){const r=new Set();lire('affectationsTuteurs').filter(v=>v.tuteurId===tuteurId&&v.entrantId!==excludeEntrantId&&v.dateDebut).forEach(v=>{let d=dateOnly(v.dateDebut),f=dateOnly(v.dateFin||v.dateDebut);while(d<=f){r.add(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}});return r}
function renduCalendrier(tuteurId,excludeEntrantId,mois,annee,selectedStart,selectedEnd){const pris=joursPris(tuteurId,excludeEntrantId),first=new Date(annee,mois,1),last=new Date(annee,mois+1,0),offset=(first.getDay()+6)%7;let h='<div class="calendar"><div class="cal-head"><button class="btn light" id="prevM">‹</button><strong>'+first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</strong><button class="btn light" id="nextM">›</button></div><div class="cal-grid">'+['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>'<div class="cal-name">'+x+'</div>').join('');for(let i=0;i<offset;i++)h+='<div class="cal-day empty"></div>';for(let n=1;n<=last.getDate();n++){const ds=`${annee}-${String(mois+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`,booked=pris.has(ds),cl='cal-day'+(booked?' booked':'')+(ds===selectedStart?' start':'')+(ds===selectedEnd?' end':'');h+=`<button class="${cl}" data-date="${ds}" ${booked?'disabled':''}>${n}</button>`}h+='</div><div class="legend"><span><i class="dot white"></i>Disponible</span><span><i class="dot red"></i>Indisponible</span></div>';if(pris.size)h+='<div class="cal-info">🔴 Les jours déjà réservés par ce tuteur sont affichés en rouge et ne sont pas sélectionnables.</div>';else h+='<div class="cal-info">Ce tuteur n’a aucune affectation : son calendrier est entièrement disponible.</div>';h+='</div>';return h}
function affecterTuteur(entrant){const t=lire('tuteurs');if(!t.length){alert('Aucun tuteur disponible. Ajoutez d’abord un tuteur.');return}const affectations=lire('affectationsTuteurs'),actuel=affectations.find(v=>v.entrantId===entrant.id);let currentMonth=new Date(actuel?.dateDebut||entrant.date||new Date().toISOString().slice(0,10));let h=`<h2>🎓 ${actuel?'Modifier':'Affecter'} le tuteur</h2><p><strong>${esc(entrant.nom)}</strong> — ${esc(entrant.agence)}</p><label>Tuteur</label><select id="sel" class="field">${t.map(x=>`<option value="${esc(x.id)}" ${actuel&&actuel.tuteurId===x.id?'selected':''}>${esc(x.nom)}</option>`).join('')}</select><br><br><label>Date de début du tutorat</label><input id="dateDebut" class="field" type="date" value="${esc(actuel?.dateDebut||entrant.date||'')}"><br><br><label>Date de fin du tutorat</label><input id="dateFin" class="field" type="date" value="${esc(actuel?.dateFin||'')}"><div id="availability"></div><div id="cal"></div><div class="actions"><button class="btn primary" id="ok">Enregistrer</button><button class="btn secondary" id="no">Annuler</button></div>`;ouvrir('affect',h);const refresh=()=>{const id=document.getElementById('sel').value,d=document.getElementById('dateDebut').value,f=document.getElementById('dateFin').value,box=document.getElementById('availability');const pris=joursPris(id,entrant.id);if(d)currentMonth=dateOnly(d);if(f&&f<d){box.innerHTML='<div class="error">La date de fin doit être postérieure ou égale à la date de début.</div>'}else{const conflits=affectations.filter(v=>v.tuteurId===id&&v.entrantId!==entrant.id&&v.dateDebut&&chevauchement(d,f,v.dateDebut,v.dateFin));box.innerHTML=conflits.length?'<div class="error">⚠️ Tuteur déjà indisponible sur cette période.<br>Déjà affecté à : <strong>'+esc(conflits.map(v=>v.entrantNom).join(', '))+'</strong>.</div>':(d?'<div class="success">✓ Tuteur disponible sur cette période.</div>':'');}document.getElementById('cal').innerHTML=renduCalendrier(id,entrant.id,currentMonth.getMonth(),currentMonth.getFullYear(),d,f);document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const ds=b.dataset.date;if(!document.getElementById('dateDebut').value||document.getElementById('dateFin').value){document.getElementById('dateDebut').value=ds;document.getElementById('dateFin').value=''}else document.getElementById('dateFin').value=ds;refresh()});document.getElementById('prevM').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()-1);refresh()};document.getElementById('nextM').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()+1);refresh()}};document.getElementById('sel').onchange=refresh;document.getElementById('dateDebut').onchange=refresh;document.getElementById('dateFin').onchange=refresh;document.getElementById('ok').onclick=()=>{const id=document.getElementById('sel').value,dateDebut=document.getElementById('dateDebut').value,dateFin=document.getElementById('dateFin').value;if(!dateDebut)return alert('Renseignez une date de début.');if(dateFin&&dateFin<dateDebut)return alert('La date de fin doit être postérieure ou égale à la date de début.');const conflits=lire('affectationsTuteurs').filter(v=>v.tuteurId===id&&v.entrantId!==entrant.id&&v.dateDebut&&chevauchement(dateDebut,dateFin,v.dateDebut,v.dateFin));if(conflits.length)return alert('Ce tuteur est déjà pris sur cette période.');const tu=t.find(x=>x.id===id),a=lire('affectationsTuteurs').filter(v=>v.entrantId!==entrant.id);a.push({id:actuel?.id||crypto.randomUUID(),entrantId:entrant.id,entrantNom:entrant.nom,tuteurId:tu.id,tuteurNom:tu.nom,agence:entrant.agence,fonction:entrant.fonction,dateDebut,dateFin});sauver('affectationsTuteurs',a);fermer('affect');afficherEntrants()};document.getElementById('no').onclick=()=>fermer('affect');refresh()}
function ouvrirPlanning(){const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs');let h='<h2>📅 Planning</h2><table class="table"><thead><tr><th>Entrant</th><th>Agence</th><th>Fonction</th><th>Tuteur</th><th>Début</th><th>Fin</th></tr></thead><tbody>';e.forEach(x=>{const q=a.find(v=>v.entrantId===x.id);h+=`<tr><td>${esc(x.nom)}</td><td>${esc(x.agence)}</td><td>${esc(x.fonction)}</td><td>${q?esc(q.tuteurNom):'Non affecté'}</td><td>${q?.dateDebut?esc(q.dateDebut):''}</td><td>${q?.dateFin?esc(q.dateFin):''}</td></tr>`});h+='</tbody></table><br><button class="btn secondary" id="c">Fermer</button>';ouvrir('planning',h);document.getElementById('c').onclick=()=>fermer('planning')}
async function auth(){const {data}=await sb.auth.getSession();if(data.session)await afficherApplication(data.session.user);else afficherConnexion();sb.auth.onAuthStateChange(async(e,s)=>{if(s)await afficherApplication(s.user);else afficherConnexion()})}auth();
</script></body></html>
