<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adept Pro Track Mate — Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:700;color:#2563eb}.container{max-width:1200px;margin:24px auto;padding:0 16px}.muted{color:#6b7280}.cards,.menu{display:grid;gap:16px}.cards{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:24px 0}.menu{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.card,.menu button{background:#fff;border:0;border-radius:12px;box-shadow:0 2px 8px #0000000d}.card{padding:20px}.card h3{margin:0 0 10px;font-size:15px}.number{font-size:32px;font-weight:700;color:#2563eb}.menu button{padding:22px;text-align:left;font-size:16px;cursor:pointer}.menu span{display:block;font-size:30px;margin-bottom:10px}.profile{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.modal-bg{position:fixed;inset:0;background:#0f172a59;z-index:10}.modal{position:fixed;z-index:11;top:3%;left:50%;transform:translateX(-50%);width:900px;max-width:96%;max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 12px 40px #0005}.field,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#6b7280;color:#fff}.light{background:#f3f4f6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.row{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin:10px 0}.table-wrap{overflow:auto}.planning{width:100%;border-collapse:collapse}.planning th,.planning td{padding:12px 10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.planning th{background:#f9fafb}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700;font-size:12px}.wait{background:#fee2e2;color:#991b1b}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:430px;max-width:100%;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0002}.authbox h1{color:#2563eb}.error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px;margin-top:12px}.successmsg{color:#166534;background:#dcfce7;padding:10px;border-radius:8px;margin-top:12px}.role{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:700;font-size:12px}@media(max-width:600px){header{padding:14px 16px}.logo{font-size:18px}.container{margin:18px auto}.cards{grid-template-columns:1fr 1fr}.menu{grid-template-columns:1fr}.modal{top:2%;padding:16px}.planning{font-size:13px}.planning th,.planning td{padding:9px 7px}}
</style></head><body><div id="app"></div><script>
const SUPABASE_URL='https://ngdgmijmdvneqbdbqwmy.supabase.co';const SUPABASE_KEY='sb_publishable_21Kr6md9gv-r9YCwPPYLsg_pi6X_1sA';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const AGENCES=['Dol de Bretagne','Mont de Marsan','Tarascon','Fleury Mérogis','Noisy le Gd','St Pierre de Chandieu','Vitry-en-Artois'];const FONCTIONS=['Conducteur','Aide-livreur','Technicien de quai','Autre'];const ROLE_RULES={'Formateur Master':{entrants:true,tuteurs:true,agences:true,planning:true},'RH':{entrants:true,tuteurs:true,agences:true,planning:true},'Responsable d’agence':{entrants:true,tuteurs:true,agences:true,planning:true}};let profilConnecte=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const lire=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};const sauver=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function fermer(id){document.getElementById(id)?.remove();document.getElementById(id+'Bg')?.remove()}function ouvrir(id,html){fermer(id);const bg=document.createElement('div');bg.id=id+'Bg';bg.className='modal-bg';bg.onclick=()=>fermer(id);document.body.appendChild(bg);const m=document.createElement('div');m.id=id;m.className='modal';m.innerHTML=html;document.body.appendChild(m);return m}function autorise(a){return!!(profilConnecte&&ROLE_RULES[profilConnecte.role]?.[a])}
async function chargerProfil(user){const {data,error}=await sb.from('profiles').select('id,role,agence,nom,email').eq('id',user.id).maybeSingle();if(error){console.error(error);return null}return data}
function afficherConnexion(msg=''){document.getElementById('app').innerHTML='<div class="auth"><div class="authbox"><h1>Adept Pro Track Mate</h1><p class="muted">Connexion sécurisée — environnement de test</p><label>E-mail</label><input id="email" class="field" type="email" autocomplete="email"><br><br><label>Mot de passe</label><input id="password" class="field" type="password" autocomplete="current-password"><div class="actions"><button class="btn primary" id="login">Se connecter</button></div><div id="authmsg">'+(msg?'<div class="successmsg">'+esc(msg)+'</div>':'')+'</div></div></div>';document.getElementById('login').onclick=connecter}
async function connecter(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,box=document.getElementById('authmsg');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){box.innerHTML='<div class="error">'+esc(error.message)+'</div>';return}await afficherApplication(data.user)}
async function afficherApplication(user){profilConnecte=await chargerProfil(user);if(!profilConnecte){await sb.auth.signOut();afficherConnexion('Profil utilisateur introuvable. Accès refusé.');return}const role=profilConnecte.role||'Utilisateur';document.getElementById('app').innerHTML='<header><div class="logo">Adept Pro Track Mate <small style="font-size:12px;color:#6b7280">TEST</small></div><div class="profile"><span>'+esc(user.email)+'</span><span class="role">'+esc(role)+'</span><button class="btn light" id="logout">Déconnexion</button></div></header><main class="container"><h1>Tableau de bord</h1><p class="muted">Environnement de test — accès selon le rôle du profil.</p><section class="cards"><div class="card"><h3>Nouveaux entrants</h3><div class="number">'+lire('nouveauxEntrants').length+'</div></div><div class="card"><h3>Tuteurs</h3><div class="number">'+lire('tuteurs').length+'</div></div><div class="card"><h3>Agences</h3><div class="number">7</div></div><div class="card"><h3>Plannings</h3><div class="number">'+lire('affectationsTuteurs').length+'</div></div></section><section class="menu">'+(autorise('entrants')?'<button id="btnEntrants"><span>👤</span><strong>Nouveaux entrants</strong><br>Ajouter et gérer les nouveaux entrants</button>':'')+(autorise('tuteurs')?'<button id="btnTuteurs"><span>🎓</span><strong>Tuteurs</strong><br>Gérer les tuteurs disponibles</button>':'')+(autorise('agences')?'<button id="btnAgences"><span>🏢</span><strong>Agences</strong><br>Voir les agences partenaires</button>':'')+(autorise('planning')?'<button id="btnPlanning"><span>📅</span><strong>Planning</strong><br>Organiser les accompagnements</button>':'')+'</section></main><footer style="text-align:center;color:#9ca3af;padding:35px">Adept Pro Track Mate — environnement de test</footer>';document.getElementById('logout').onclick=()=>sb.auth.signOut();if(document.getElementById('btnEntrants'))document.getElementById('btnEntrants').onclick=afficherEntrants;if(document.getElementById('btnTuteurs'))document.getElementById('btnTuteurs').onclick=ouvrirTuteurs;if(document.getElementById('btnAgences'))document.getElementById('btnAgences').onclick=ouvrirAgences;if(document.getElementById('btnPlanning'))document.getElementById('btnPlanning').onclick=ouvrirPlanning}
function afficherEntrants(){if(!autorise('entrants'))return;const e=lire('nouveauxEntrants');let h='<h2>👤 Nouveaux entrants</h2>';if(!e.length)h+='<div class="row">Aucun entrant enregistré.</div>';e.forEach((x,i)=>h+='<div class="row"><strong>'+esc(x.nom)+'</strong><p>📅 '+esc(x.date)+'<br>💼 '+esc(x.fonction)+'<br>🏢 '+esc(x.agence)+'</p><button class="btn danger" data-del="'+i+'">🗑️ Supprimer</button></div>');h+='<div class="actions"><button class="btn primary" id="add">➕ Ajouter</button><button class="btn secondary" id="close">Fermer</button></div>';ouvrir('entrants',h);document.getElementById('add').onclick=()=>{fermer('entrants');ajouterEntrant()};document.getElementById('close').onclick=()=>fermer('entrants');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=lire('nouveauxEntrants');a.splice(+b.dataset.del,1);sauver('nouveauxEntrants',a);afficherEntrants()})}
function ajouterEntrant(){if(!autorise('entrants'))return;ouvrir('add','<h2>👤 Ajouter un nouvel entrant</h2><label>Nom et prénom</label><input id="n" class="field"><br><br><label>Date d’entrée</label><input id="d" class="field" type="date"><br><br><label>Fonction</label><select id="f" class="field">'+FONCTIONS.map(x=>'<option>'+x+'</option>').join('')+'</select><br><br><label>Agence</label><select id="a" class="field">'+AGENCES.map(x=>'<option>'+x+'</option>').join('')+'</select><div class="actions"><button class="btn primary" id="save">Ajouter</button><button class="btn secondary" id="cancel">Annuler</button></div>');document.getElementById('save').onclick=()=>{const n=document.getElementById('n').value.trim(),d=document.getElementById('d').value,f=document.getElementById('f').value,a=document.getElementById('a').value;if(!n||!d)return alert('Renseignez le nom et la date.');const e=lire('nouveauxEntrants');e.push({id:String(Date.now()),nom:n,date:d,fonction:f,agence:a});sauver('nouveauxEntrants',e);fermer('add');afficherEntrants()};document.getElementById('cancel').onclick=()=>fermer('add')}
function ouvrirTuteurs(){if(!autorise('tuteurs'))return;let h='<h2>🎓 Gestion des tuteurs</h2><input id="tn" class="field" placeholder="Nom et prénom"><div class="actions"><button class="btn primary" id="ta">Ajouter</button></div><hr>';const t=lire('tuteurs');t.forEach((x,i)=>h+='<div class="row">👤 '+esc(x.nom)+' <button class="btn danger" data-t="'+i+'">🗑️</button></div>');h+='<button class="btn secondary" id="tc">Fermer</button>';ouvrir('tuteurs',h);document.getElementById('ta').onclick=()=>{const n=document.getElementById('tn').value.trim();if(!n)return;const t=lire('tuteurs');t.push({id:String(Date.now()),nom:n});sauver('tuteurs',t);ouvrirTuteurs()};document.getElementById('tc').onclick=()=>fermer('tuteurs');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const t=lire('tuteurs');t.splice(+b.dataset.t,1);sauver('tuteurs',t);ouvrirTuteurs()})}
function ouvrirAgences(){if(!autorise('agences'))return;ouvrir('agences','<h2>🏢 Agences</h2>'+AGENCES.map(x=>'<div class="row">🏢 '+x+'</div>').join('')+'<button class="btn secondary" id="c">Fermer</button>');document.getElementById('c').onclick=()=>fermer('agences')}
function ouvrirPlanning(){if(!autorise('planning'))return;const e=lire('nouveauxEntrants'),a=lire('affectationsTuteurs');let h='<h2>📅 Planning</h2><div class="table-wrap"><table class="planning"><thead><tr><th>Entrant</th><th>Agence</th><th>Fonction</th><th>Tuteur</th><th>Accompagnement</th></tr></thead><tbody>';e.forEach(x=>{const q=a.find(v=>v.entrantId===x.id);h+='<tr><td>'+esc(x.nom)+'</td><td>'+esc(x.agence)+'</td><td>'+esc(x.fonction)+'</td><td>'+(q?esc(q.tuteurNom):'<span class="badge wait">Non affecté</span>')+'</td><td>'+(q?esc(q.dateDebut)+' → '+esc(q.dateFin):'À programmer')+'</td></tr>'});h+='</tbody></table></div><br><button class="btn secondary" id="c">Fermer</button>';ouvrir('planning',h);document.getElementById('c').onclick=()=>fermer('planning')}
async function auth(){const {data}=await sb.auth.getSession();if(data.session)await afficherApplication(data.session.user);else afficherConnexion();sb.auth.onAuthStateChange(async(e,s)=>{if(s)await afficherApplication(s.user);else afficherConnexion()})}auth();
</script></body></html>
